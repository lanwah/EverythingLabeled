<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>对象图标 — 设计稿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <div class="preview-page">
    <div class="preview-bar">
      <a class="back" href="index.html">← 入口</a>
      <h1>对象图标</h1>
    </div>

    <div class="icon-sheet">
      <article class="icon-tile">
        <span class="kind-icon file" role="img" aria-label="文件"></span>
        <h2>文件</h2>
        <p>kind <code>file</code> · <code>icons/file.svg</code></p>
        <div class="icon-sizes" aria-hidden="true">
          <span><i class="kind-icon file" style="width:16px;height:16px"></i>16</span>
          <span><i class="kind-icon file" style="width:20px;height:20px"></i>20</span>
          <span><i class="kind-icon file" style="width:24px;height:24px"></i>24</span>
          <span><i class="kind-icon file" style="width:32px;height:32px"></i>32</span>
        </div>
      </article>

      <article class="icon-tile">
        <span class="kind-icon folder" role="img" aria-label="文件夹"></span>
        <h2>文件夹</h2>
        <p>kind <code>folder</code> · <code>icons/folder.svg</code></p>
        <div class="icon-sizes" aria-hidden="true">
          <span><i class="kind-icon folder" style="width:16px;height:16px"></i>16</span>
          <span><i class="kind-icon folder" style="width:20px;height:20px"></i>20</span>
          <span><i class="kind-icon folder" style="width:24px;height:24px"></i>24</span>
          <span><i class="kind-icon folder" style="width:32px;height:32px"></i>32</span>
        </div>
      </article>

      <article class="icon-tile">
        <span class="kind-icon webpage" role="img" aria-label="网页"></span>
        <h2>网页</h2>
        <p>kind <code>url</code> · <code>icons/webpage.svg</code></p>
        <div class="icon-sizes" aria-hidden="true">
          <span><i class="kind-icon webpage" style="width:16px;height:16px"></i>16</span>
          <span><i class="kind-icon webpage" style="width:20px;height:20px"></i>20</span>
          <span><i class="kind-icon webpage" style="width:24px;height:24px"></i>24</span>
          <span><i class="kind-icon webpage" style="width:32px;height:32px"></i>32</span>
        </div>
      </article>
    </div>

    <p class="gallery-note" style="max-width:920px;margin-left:auto;margin-right:auto">
      单色剪影，用 CSS mask 着色。查找结果行见
      <a href="find.html?state=filled">按标签查找 · 填充态</a>。
    </p>
  </div>
</body>
</html>
