<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>浏览器扩展 · 设置 — 设计稿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <div class="preview-page">
    <div class="preview-bar">
      <a class="back" href="index.html">← 入口</a>
      <h1>浏览器扩展 · 设置</h1>
      <div class="state-toggle" role="group" aria-label="状态">
        <button type="button" data-state="empty">空状态</button>
        <button type="button" data-state="filled">填充态</button>
      </div>
    </div>

    <div class="preview-stage">
      <div class="ext-frame">
        <div class="panel is-active" data-state="filled">
          <header class="ext-head">
            <div>
              <h1>设置</h1>
              <p class="ext-lead">连接本机标签服务。地址和 Token 在这里手工填写。</p>
            </div>
          </header>

          <form>
            <label class="field">
              <span>服务地址</span>
              <input class="only-empty" type="text" value="" placeholder="http://127.0.0.1:5123" />
              <input class="only-filled" type="text" value="http://127.0.0.1:5123" readonly />
            </label>
            <label class="field">
              <span>Token</span>
              <input class="only-empty" type="password" value="" />
              <input class="only-filled" type="password" value="local-token" readonly />
            </label>
            <label class="check-row">
              <input type="checkbox" checked />
              <span>去标前确认</span>
            </label>
            <label class="field">
              <span>预览条数</span>
              <input type="number" value="8" readonly />
            </label>
            <div class="footer">
              <span class="status only-empty"></span>
              <span class="status ok only-filled">服务可达，token 有效</span>
              <div class="actions-right">
                <button type="button" class="btn">探测连接</button>
                <button type="button" class="btn btn-primary">保存</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script src="preview.js"></script>
</body>
</html>
