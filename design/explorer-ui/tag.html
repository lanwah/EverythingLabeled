<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>打标 — 设计稿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <div class="preview-page">
    <div class="preview-bar">
      <a class="back" href="index.html">← 入口</a>
      <h1>打标</h1>
      <div class="state-toggle" role="group" aria-label="状态">
        <button type="button" data-state="empty">空状态</button>
        <button type="button" data-state="filled">填充态</button>
      </div>
    </div>

    <div class="preview-stage">
      <div class="window" role="dialog" aria-label="打标">
        <div class="caption">
          <div class="caption-left">
            <span class="caption-icon" aria-hidden="true">&#xE8EC;</span>
            <span>打标 — EverythingLabeled</span>
          </div>
          <div class="caption-controls">
            <button type="button" aria-label="最小化">─</button>
            <button type="button" aria-label="最大化">□</button>
            <button type="button" class="close" aria-label="关闭">✕</button>
          </div>
        </div>

        <div class="window-body">
          <div class="panel is-active" data-state="filled">
            <p class="section-label">目标路径</p>
            <ul class="path-list surface">
              <li class="only-empty" style="color: var(--muted)">未选择路径</li>
              <li class="only-filled">D:\Work\Git\NIS_SE\NIS_Gch_SE\React\nursing-nis-app</li>
              <li class="only-filled">D:\Work\Git\NIS_SE\NIS_Gch_SE\React\nursing-nis-app\src</li>
              <li class="only-filled">D:\Projects\Other\EverythingLabeled\docs\explorer.md</li>
            </ul>

            <div style="margin-top:10px">
              <p class="section-label">当前标签（点叉号去除）</p>
              <div class="surface tag-chip-well" id="current-tags">
                <p class="empty-hint only-empty" id="tags-empty">暂无标签</p>
                <div class="tag-chips only-filled" id="current-tag-chips">
                  <span class="chip">工作 <button type="button" aria-label="去除 工作">×</button></span>
                  <span class="chip">React <button type="button" aria-label="去除 React">×</button></span>
                  <span class="chip">nis-app <button type="button" aria-label="去除 nis-app">×</button></span>
                </div>
              </div>
            </div>

            <div class="alias-row">
              <label for="alias-input">别名</label>
              <div class="alias-field">
                <div class="alias-chip-field surface">
                  <div class="alias-chip-wrap">
                    <span id="tag-chips" class="tag-applied-chips" aria-live="polite"></span>
                    <input id="alias-input" type="text" value="" placeholder="输入别名…" autocomplete="off" spellcheck="false" />
                  </div>
                </div>
                <ul id="alias-suggest" class="suggest-list" aria-label="联想" hidden></ul>
              </div>
            </div>

            <label class="check-row">
              <input id="create-missing" type="checkbox" class="only-filled" />
              <input type="checkbox" class="only-empty" disabled />
              <span>创建缺失标签</span>
            </label>

            <div class="footer">
              <span id="tag-status" class="status">准备就绪</span>
              <div class="actions-right">
                <button type="button" class="btn" disabled>取消</button>
                <button id="tag-submit" type="button" class="btn btn-primary only-filled">打标</button>
                <button type="button" class="btn btn-primary only-empty" disabled>打标</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="preview.js"></script>
  <script src="tag.js"></script>
  <script>
    (function () {
      const well = document.getElementById("current-tags");
      const chips = document.getElementById("current-tag-chips");
      if (!well || !chips) return;

      chips.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button || !chips.contains(button)) return;
        const chip = button.closest(".chip");
        if (!chip) return;
        chip.remove();
        if (chips.querySelector(".chip")) return;
        const hint = document.createElement("p");
        hint.className = "empty-hint";
        hint.textContent = "暂无标签";
        chips.hidden = true;
        well.appendChild(hint);
      });
    })();
  </script>
</body>
</html>
