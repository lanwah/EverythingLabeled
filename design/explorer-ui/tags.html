<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>看标签 — 设计稿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <div class="preview-page">
    <div class="preview-bar">
      <a class="back" href="index.html">← 入口</a>
      <h1>看标签</h1>
      <div class="state-toggle" role="group" aria-label="状态">
        <button type="button" data-state="empty">空状态</button>
        <button type="button" data-state="filled">填充态</button>
      </div>
    </div>

    <div class="preview-stage">
      <div class="window" role="dialog" aria-label="看标签">
        <div class="caption">
          <div class="caption-left">
            <span class="caption-icon" aria-hidden="true">&#xE8FD;</span>
            <span>看标签 — EverythingLabeled</span>
          </div>
          <div class="caption-controls">
            <button type="button" aria-label="最小化">─</button>
            <button type="button" aria-label="最大化">□</button>
            <button type="button" class="close" aria-label="关闭">✕</button>
          </div>
        </div>

        <div class="window-body">
          <div class="panel is-active split-body" data-state="filled">
            <div>
              <p class="section-label">路径</p>
              <ul class="path-list surface path-compact">
                <li class="only-empty" style="color: var(--muted)">未选择路径</li>
                <li class="only-filled">D:\Work\Git\NIS_SE\NIS_Gch_SE\React\nursing-nis-app</li>
              </ul>
            </div>

            <div style="flex:1;min-height:0;display:flex;flex-direction:column">
              <p class="section-label">标签</p>
              <div class="surface" style="flex:1">
                <p class="empty-hint only-empty">此对象尚无标签</p>
                <div class="tag-chips only-filled">
                  <span class="chip">工作</span>
                  <span class="chip">React</span>
                  <span class="chip">nis-app</span>
                  <span class="chip">前端</span>
                </div>
              </div>
            </div>

            <div class="footer">
              <span class="status only-empty">单选对象可查看标签</span>
              <span class="status only-filled">4 个别名</span>
              <div class="actions-right">
                <button type="button" class="btn">切换到打标</button>
                <button type="button" class="btn btn-primary">切换到去标</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="preview.js"></script>
</body>
</html>
